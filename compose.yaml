
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: production
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USERNAME: railsuser
      DATABASE_PASSWORD: RailsPass123!
      SECRET_KEY_BASE: "development-secret-key-for-local-testing-only"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - task-manager-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: RailsRoot123!
      MYSQL_DATABASE: task_manager_production
      MYSQL_USER: railsuser
      MYSQL_PASSWORD: RailsPass123!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - task-manager-network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  task-manager-network:
    driver: bridge

volumes:
  mysql_data:
