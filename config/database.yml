
default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: railsuser
  password: RailsPass123!
  host: 127.0.0.1
  port: 3306

development:
  <<: *default
  database: task_manager_development

test:
  <<: *default
  database: task_manager_test

production:
  <<: *default
  database: task_manager_production
  username: <%= ENV.fetch("DATABASE_USERNAME", "railsuser") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "RailsPass123!") %>
  host: <%= ENV.fetch("DATABASE_HOST", "mysql") %>